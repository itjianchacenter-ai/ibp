server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/html text/css text/plain text/csv application/javascript text/javascript application/json;

  # nginx สืบทอด add_header จากระดับบนได้ "ก็ต่อเมื่อระดับปัจจุบันไม่มี add_header เลย"
  # เดิมประกาศ header ความปลอดภัยไว้ระดับ server แล้วมี add_header ใน location
  # ทั้งสองบล็อก — header ระดับ server จึงถูกยกเลิกทั้งหมดตรงนั้น รวมถึงหน้า
  # /index.html ที่เป็นหน้าหลัก จึงต้องประกาศซ้ำในทุก location ที่มี add_header
  set $csp "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

  # assets ไม่มี hash ในชื่อไฟล์ — ห้ามแคชยาว ไม่งั้น deploy แล้วผู้ใช้เดิม
  # ยังรัน forecast.js ตัวเก่าคู่กับ index.html ตัวใหม่
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache" always;
    # ไม่ใช้ SPA fallback — หน้านี้เป็น static หน้าเดียว ไม่มี client-side router
    # เดิม try_files ... /index.html ทำให้ไฟล์ที่หายคืน 200 + HTML ทั้งก้อน
    # 404 จึงมองไม่เห็นทั้งใน log และจาก fetch ที่เช็ค res.ok
    try_files $uri $uri/ =404;
  }
}
