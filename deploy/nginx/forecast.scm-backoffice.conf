# ═══════════════════════════════════════════════════════════════════════════
# nginx site config — JIAN CHA IBP Control Tower · Module 02+ Sales Forecast
# Host: forecast.scm-backoffice.com on the DigitalOcean VPS, behind Cloudflare.
# TLS: Cloudflare Origin Certificate (Cloudflare SSL/TLS mode = Full (strict)).
#      ใบเดียวกับ scm-backoffice.com ครอบ *.scm-backoffice.com อยู่แล้ว
#
# ติดตั้ง:
#   sudo cp deploy/nginx/forecast.scm-backoffice.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/forecast.scm-backoffice.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# อัปเดตเนื้อหา: bash deploy/update.sh
#
# ── SSO ────────────────────────────────────────────────────────────────────
# ทุก location ที่เสิร์ฟเนื้อหาจริงถูกกันด้วย auth_request → jc-auth (127.0.0.1:9002)
# เหตุผล: แอปเป็น static file ล้วน หน้า login ที่เป็น JS อย่างเดียวกันอะไรไม่ได้เลย
# เพราะ `curl .../js/02.js` ดึง DATA ทั้งชุดได้โดยไม่ต้องผ่านหน้า login
# ต้องกันที่ nginx เท่านั้นถึงจะเป็นการกันจริง
#
# ไฟล์นี้แตะเฉพาะ server block ของ forecast.scm-backoffice.com
# ไม่กระทบ jc-round / scm-center / scm-procurement / scm-backoffice บนเครื่องเดียวกัน
# ═══════════════════════════════════════════════════════════════════════════

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name forecast.scm-backoffice.com;
    return 301 https://forecast.scm-backoffice.com$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) ยังใช้ "http2" เป็นพารามิเตอร์ของ listen
    # ส่วน "http2 on;" เป็นของ 1.25.1 ขึ้นไป — ต้องตรงกับเวอร์ชันบนเครื่องนี้
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forecast.scm-backoffice.com;

    ssl_certificate     /etc/nginx/ssl/scm-backoffice.com.pem;
    ssl_certificate_key /etc/nginx/ssl/scm-backoffice.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/forecast;
    index index.html;

    charset utf-8;
    # text/html อยู่ใน charset_types ตั้งต้นอยู่แล้ว ใส่ซ้ำ nginx จะเตือน
    charset_types text/css text/plain text/csv application/javascript text/javascript application/json;

    # connect-src 'none' บังคับ NFR-02 / AC-07 ที่ระดับเบราว์เซอร์ — โมดูลไม่มี
    # backend การปิด fetch/XHR/WebSocket ทั้งหมดทำให้ "ไฟล์ยอดขายไม่ออกจากเครื่อง"
    # เป็นสิ่งที่เบราว์เซอร์บังคับ ไม่ใช่แค่คำสัญญาในเอกสาร
    # style-src ต้องมี 'unsafe-inline' เพราะ index.html ใช้ style="" 126 จุด
    #
    # SSO ไม่ได้ทำให้บรรทัดนี้อ่อนลงเลย: หน้าแอปไม่เคยคุยกับ Supabase
    # การล็อกอินเกิดบนหน้า /login.html ซึ่งมี CSP ของตัวเองด้านล่าง
    set $csp "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    # CSP ของหน้า login — ต่างจากหน้าแอคแค่ connect-src 'self'
    # เพราะต้อง POST token ไป /auth/session ที่ origin เดียวกัน
    # ขาไป Microsoft เป็น top-level navigation ซึ่ง CSP ไม่ได้ควบคุม
    # จึงไม่ต้องเปิด connect-src ให้ supabase.co เลยแม้แต่หน้าเดียว
    set $csp_login "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    # ── ด่านตรวจสิทธิ์ (ภายใน) ────────────────────────────────────────────
    # internal = ผู้ใช้ยิงตรงมาที่ /_auth เองไม่ได้ nginx เรียกได้อย่างเดียว
    location = /_auth {
        internal;
        proxy_pass              http://127.0.0.1:9002/verify;
        proxy_pass_request_body off;             # ตัวตรวจอ่านแค่คุกกี้ ไม่ต้องใช้ body
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
        proxy_set_header        X-Original-URI $request_uri;
    }

    # 401 จากด่าน → พาไปหน้า login พร้อมจำหน้าที่ตั้งใจเปิดไว้
    # (login.js ตรวจ next ซ้ำอีกชั้น รับเฉพาะ path ภายใน กัน open redirect)
    error_page 401 = @tologin;
    location @tologin {
        return 302 /login.html?denied=1&next=$request_uri;
    }

    # ── หน้า login · ต้องเข้าถึงได้โดยยังไม่ล็อกอิน ────────────────────────
    location = /login.html {
        auth_request off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_login always;
    }
    location = /login.js {
        auth_request off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp_login always;
    }

    # ── ปลายทางของตัวตรวจสิทธิ์ที่ผู้ใช้เรียกได้ ───────────────────────────
    # /auth/session — หน้า login ส่ง token มาแลกคุกกี้ (ยังไม่ล็อกอิน จึงไม่กัน)
    location = /auth/session {
        auth_request off;
        proxy_pass       http://127.0.0.1:9002/session;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store" always;
    }
    location = /logout {
        auth_request off;
        proxy_pass       http://127.0.0.1:9002/logout;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store" always;
    }
    location = /whoami {
        auth_request off;                        # ตัวมันเองตอบ 401 อยู่แล้ว
        proxy_pass       http://127.0.0.1:9002/whoami;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store" always;
    }

    # nginx สืบทอด add_header จากระดับบนได้ก็ต่อเมื่อระดับปัจจุบันไม่มี add_header เลย
    # จึงต้องประกาศซ้ำในทุก location ที่มี add_header
    location /assets/ {
        auth_request /_auth;
        # ไฟล์ใน assets/ ไม่มี hash ในชื่อ — ห้ามใช้ immutable/max-age ยาว
        # ไม่งั้น deploy แล้วผู้ใช้เดิมค้าง forecast.js ตัวเก่าคู่กับ index.html ตัวใหม่
        # (ต่างจาก scm-backoffice.com ที่ build ด้วย Vite แล้วชื่อไฟล์มี fingerprint)
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # ── ไฟล์ JS/asset ขนาดใหญ่ — ให้ใช้ 304 revalidation ได้ตามปกติ ────
    # ต้องแยกจาก location / เพราะที่นั่นปิด 304 (เหตุผลดูด้านล่าง)
    # js/02.js ก้อนเดียว 669KB ถ้าโหลดเต็มทุกครั้งจะเปลืองโดยไม่จำเป็น
    location /js/ {
        auth_request /_auth;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }
    location /m02p/assets/ {
        auth_request /_auth;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    location / {
        auth_request /_auth;
        # บันทึกว่าใครเปิดอะไร — ตัวตรวจส่งอีเมลกลับมาทาง X-Auth-Email
        auth_request_set $auth_email $upstream_http_x_auth_email;

        # ── ห้ามตอบ 304 สำหรับ HTML ──────────────────────────────────
        # แถบผู้ใช้ถูกฉีดตอน "เสิร์ฟ" แต่ไฟล์บนดิสก์ไม่เปลี่ยน ETag จึงเดิม
        # เบราว์เซอร์ที่เคยโหลดหน้าแล้วจะยิง If-None-Match แล้วได้ 304
        # ซึ่ง "ไม่มี body" — sub_filter ไม่มีอะไรให้ฉีด ผู้ใช้เลยไม่เห็นแถบ
        # ตลอดไป (เจอจริง: log ขึ้น GET / → 304 หลัง deploy แถบ)
        # และโดยความหมาย หน้านี้ personalized รายคนแล้ว 304 จึงผิดอยู่ดี
        etag off;
        if_modified_since off;

        # ── แถบผู้ใช้ + ปุ่มออกจากระบบ ────────────────────────────────
        # ฉีดที่ nginx ตอนเสิร์ฟ ไม่แตะตัวแอปเลย:
        #   · ไม่ต้องผ่อน CSP — ไม่มี fetch (connect-src 'none' คงเดิม)
        #     ออกจากระบบเป็น <a href> ธรรมดา ไม่ใช้ JS สักบรรทัด
        #   · ทำงานเฉพาะ text/html (ค่า default ของ sub_filter_types)
        #     ไฟล์ js/csv ไม่ถูกแตะ
        #   · $auth_email ผ่านการบังคับชุดตัวอักษร [a-z0-9._%+-@] จาก
        #     ตัวตรวจแล้ว จึงวางใน HTML ได้โดยไม่มีทางเป็น markup
        sub_filter '</body>'
            '<div style="position:fixed;bottom:14px;right:14px;z-index:2147483000;background:#1C1A17;color:#F1EDE4;padding:7px 14px;border-radius:999px;font-size:12px;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:.94">$auth_email&nbsp;&nbsp;·&nbsp;&nbsp;<a href="/logout" style="color:#AD9C82;text-decoration:none;font-weight:600">ออกจากระบบ</a></div></body>';
        sub_filter_once on;

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
        # ไม่ใช้ SPA fallback — หน้านี้เป็น static หน้าเดียว ไม่มี client-side router
        # ถ้า fallback ไป index.html ไฟล์ที่หายจะคืน 200 ทำให้ 404 มองไม่เห็นใน log
        try_files $uri $uri/ =404;
    }

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript text/javascript application/json image/svg+xml text/csv;

    # หมายเหตุ: ห้ามใส่ log_format ตรงนี้ — nginx อนุญาตเฉพาะใน http context
    # ถ้าใส่ไว้ nginx -t จะไม่ผ่าน และถ้า restart nginx ตอนไฟล์นี้อยู่ใน
    # sites-enabled เว็บ "ทุกตัว" บนเครื่องจะล่มพร้อมกัน ไม่ใช่แค่ไซต์นี้
    #
    # อยากได้อีเมลผู้ใช้ใน access log ให้ติดตั้งไฟล์เสริม (ไม่บังคับ):
    #   sudo cp deploy/nginx/forecast-log-format.conf /etc/nginx/conf.d/
    # แล้วเปลี่ยนบรรทัดล่างเป็น
    #   access_log /var/log/nginx/forecast.access.log forecast_sso;
    #
    # ถ้าไม่ติดตั้ง การตรวจสอบย้อนหลังยังทำได้จาก journal ของตัวตรวจสิทธิ์
    # ซึ่งบันทึกทุกครั้งที่เข้า/ออกพร้อมอีเมลอยู่แล้ว:  journalctl -u jc-auth
    access_log /var/log/nginx/forecast.access.log;
    error_log  /var/log/nginx/forecast.error.log;
}
