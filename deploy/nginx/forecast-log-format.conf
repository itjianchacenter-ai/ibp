# ═══════════════════════════════════════════════════════════════════════════
# ไฟล์เสริม (ไม่บังคับ) — รูปแบบ access log ที่มีอีเมลผู้ใช้
#
#   sudo cp deploy/nginx/forecast-log-format.conf /etc/nginx/conf.d/
#   # แล้วแก้ใน forecast.scm-backoffice.conf:
#   #   access_log /var/log/nginx/forecast.access.log forecast_sso;
#   sudo nginx -t && sudo systemctl reload nginx
#
# ทำไมต้องแยกไฟล์: log_format ใช้ได้เฉพาะใน http context ใส่ใน server block
# ไม่ได้ · ไฟล์ใน conf.d/ ถูกรวมเข้าที่ http จึงเป็นที่ที่ถูกต้อง
#
# กระทบไซต์อื่นไหม: ไม่ — การ "ประกาศ" รูปแบบ log ไว้เฉย ๆ ไม่เปลี่ยนพฤติกรรม
# ของใคร ไซต์อื่นยังใช้รูปแบบเดิมของตัวเองต่อไป มีเฉพาะไซต์ที่เขียน
# access_log ... forecast_sso; เท่านั้นที่ใช้รูปแบบนี้
#
# $auth_email มาจาก auth_request_set ใน vhost ของ forecast
# ไซต์อื่นที่ไม่ได้ตั้งค่านั้นจะได้ค่าว่าง (ขึ้นเป็น "-") ไม่ error
# ═══════════════════════════════════════════════════════════════════════════
log_format forecast_sso '$remote_addr - $auth_email [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
